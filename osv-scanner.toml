[[IgnoredVulns]]
id = "GHSA-735f-pc8j-v9w8"
ignoreUntil = 2027-01-31
reason = "protobuf-javalite 3.22.3 comes with Cronet (cronet_http, play-services-cronet). In the app it parses only Cronet's HTTP flags file, which HttpFlagsLoader reads from a system-image package (MATCH_SYSTEM_ONLY), never data from the network or other apps. Upgrade with the next dependency update."
