name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  # No secret and no cache: the files are built from the tag's sources alone
  # and signed in a job of their own.
  build:
    if: github.repository == 'go-vikunja/app' || vars.VIKUNJA_APP_RELEASE_DRY_RUN == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tool/ci/release_build.sh --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: build/release/unsigned/
          if-no-files-found: error
          retention-days: 14

  # Outside an environment a job sees only repository and organisation
  # secrets: a release secret there is readable without the reviewers.
  secret-scope:
    if: github.repository == 'go-vikunja/app'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that no release secret is readable outside the environment release
        env:
          OUTSIDE_RELEASE_ENVIRONMENT: >-
            ${{ secrets.KEYSTORE_BASE64 != '' || secrets.KEY_PROPERTIES != ''
            || secrets.APK_KEYSTORE_BASE64 != '' || secrets.APK_KEY_PROPERTIES != ''
            || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
            || secrets.S3_ACCESS_KEY != '' || secrets.S3_SECRET_KEY != '' }}
        run: tool/ci/release_publish.sh scope

  publish:
    if: github.repository == 'go-vikunja/app'
    needs: [ci, build, secret-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: build/release/unsigned
      # Whether each secret is set, never its value: every other step gets only
      # the secrets it uses.
      - name: Check the release
        env:
          HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES != '' }}
          HAS_APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
          HAS_APK_KEY_PROPERTIES: ${{ secrets.APK_KEY_PROPERTIES != '' }}
          HAS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY != '' }}
          HAS_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY != '' }}
          HAS_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT != '' }}
          HAS_S3_BUCKET: ${{ secrets.S3_BUCKET != '' }}
          HAS_S3_REGION: ${{ secrets.S3_REGION != '' }}
        run: tool/ci/release_publish.sh check
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_PROPERTIES: ${{ secrets.APK_KEY_PROPERTIES }}
        run: tool/ci/release_sign.sh
      - name: Publish to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VIKUNJA_APP_PLAY_ROLLOUT: ${{ vars.VIKUNJA_APP_PLAY_ROLLOUT }}
        run: tool/ci/release_publish.sh play
      - name: Publish the APK on dl.vikunja.io
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: tool/ci/release_publish.sh dl
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/ci/release_publish.sh github

  # A configured test repository: the same scripts with throwaway keys,
  # publishing nothing. No environment and no secrets.
  dry-run:
    if: github.repository != 'go-vikunja/app' && vars.VIKUNJA_APP_RELEASE_DRY_RUN == 'true'
    needs: [ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: build/release/unsigned
      - name: Check the release
        run: tool/ci/release_publish.sh --dry-run check
      - name: Sign
        run: tool/ci/release_sign.sh --dry-run
      - name: Publish to Google Play
        run: tool/ci/release_publish.sh --dry-run play
      - name: Publish the APK on dl.vikunja.io
        run: tool/ci/release_publish.sh --dry-run dl
      - name: Publish the GitHub release
        run: tool/ci/release_publish.sh --dry-run github
