name: Vulnerability scan

# Separate from ci.yaml so that its concurrency group keeps a push and the
# weekly run from cancelling each other. The weekly run catches advisories
# published after a lockfile last changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: Vulnerability scan (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      # true once the repository has code scanning
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pubspec.lock
        --lockfile=app/editor/package-lock.json
        --lockfile=app/android/app/gradle.lockfile
