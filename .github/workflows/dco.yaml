name: DCO

# Every commit of a pull request, merges included, needs a Signed-off-by
# line of its author (CONTRIBUTING.md). The history before the pull request
# is not checked.
on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sign-off:
    name: Sign-off (DCO)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Test the pull request's version of the check
        run: python3 -I tool/check_dco.py --self-test

      # The check that judges a pull request comes from its base commit, so
      # the pull request cannot change it.
      - name: Check the sign-offs with the base commit's check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:tool/check_dco.py" > "$RUNNER_TEMP/check_dco.py"
          python3 -I "$RUNNER_TEMP/check_dco.py" --repository "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA"
