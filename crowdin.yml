# Vikunja's Crowdin project, synced by the workflow "Crowdin"
# (.github/workflows/crowdin.yaml, tool/ci/crowdin_sync.sh; D88).
# No credentials here: the CLI reads CROWDIN_PERSONAL_TOKEN from the
# environment.
project_id: "462614"
preserve_hierarchy: true

files:
  - source: /app/lib/l10n/arb/app_en.arb
    dest: /app_en.arb
    translation: /app/lib/l10n/arb/app_%two_letters_code%.arb
    type: arb
    update_option: update_as_unapproved
    export_only_approved: true
    skip_untranslated_strings: true
    # Every regional or script file needs its base language's file
    # (app_sr.arb is committed). "no" is quoted: YAML 1.1 reads it as false.
    # The CLI took only Crowdin's standard codes here when this was written,
    # so Vikunja's custom Swiss German is mapped in the project's settings
    # (D88); the workflow takes German from a download of its own either way.
    languages_mapping:
      two_letters_code:
        pt-PT: pt
        pt-BR: pt_BR
        zh-CN: zh
        zh-TW: zh_Hant
        "no": nb
        sr-CS: sr_Latn
