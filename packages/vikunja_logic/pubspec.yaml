name: vikunja_logic
description: Pure-Dart client logic (quick add, the filter language, positions, checklists), written to behave like the Vikunja web frontend and server.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  html: ^0.15.7
  meta: ^1.16.0
  timezone: ^0.11.2
  vikunja_domain:
    path: ../vikunja_domain

dev_dependencies:
  flutter_test:
    sdk: flutter

# The app shows these notices on its licence page; declaring the file here
# does not make the package depend on Flutter.
flutter:
  assets:
    - THIRD_PARTY_NOTICES.md
