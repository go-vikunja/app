# Local Vikunja server for the vikunja_api contract tests and manual sign-in
# tests. Only the latest release is tested (owner decision, 2026-10-09):
#   34527  2.7.0  latest release
# Bump the image tag when a new Vikunja release comes out.
# The host port is referenced by the contract tests, tool/*.sh and the docs;
# do not change it. It is published on 127.0.0.1 only, because the server
# allows open registration with a public JWT secret. An Android emulator
# reaches it as localhost after `adb reverse tcp:34527 tcp:34527`.
#
# Start: docker compose -f test_servers/docker-compose.yaml up -d
#        (docker-compose takes the same arguments)
# Wait:  tool/wait_for_test_servers.sh
# Seed:  tool/seed_e2e_user.sh (the sign-in test user, see the README)
# Stop:  docker compose -f test_servers/docker-compose.yaml down
#
# The images are built FROM scratch, so there is no shell for a healthcheck;
# readiness is polled from the host by tool/wait_for_test_servers.sh.
# There is deliberately no top-level `name:`. The project name defaults to
# this directory, and a different name would start a second stack that
# collides with a running one on the same ports.

x-vikunja-env: &vikunja-env
  # Fixed dummy secrets: these servers only ever hold throwaway test data.
  VIKUNJA_SERVICE_SECRET: contract-tests-only-not-a-secret
  VIKUNJA_SERVICE_JWTSECRET: contract-tests-only-not-a-secret
  # The container runs as uid 1000 and its default paths (/db, /app/vikunja/files)
  # are not writable without volumes. The tmpfs below keeps all state in
  # memory, so every restart starts from an empty server.
  VIKUNJA_FILES_BASEPATH: /tmp/files
  VIKUNJA_DATABASE_TYPE: sqlite
  VIKUNJA_DATABASE_PATH: /tmp/vikunja.db
  # The contract tests and tool/seed_e2e_user.sh create users through /register.
  VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
  # All test traffic comes from one IP. The login limiter (10/min) cannot be
  # disabled and still applies.
  VIKUNJA_RATELIMIT_ENABLED: "false"

# VIKUNJA_SERVICE_PUBLICURL becomes `frontend_url` in /info, where the app
# opens the OAuth authorize page, and it is also the bundled web frontend's
# API base URL. localhost works for the host, the iOS simulator (shares the
# host's network) and the Android emulator with `adb reverse`.
services:
  vikunja-2-7:
    image: vikunja/vikunja:2.7.0
    environment:
      <<: *vikunja-env
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:34527/
    tmpfs: ["/tmp:mode=1777"]
    ports: ["127.0.0.1:34527:3456"]
