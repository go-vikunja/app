# Local Vikunja server for the vikunja_api contract tests and manual sign-in
# tests. Only the latest release is tested (owner decision, 2026-10-09):
#   34527  2.8.0  latest release
#   34528-34531  the same release behind TLS, opt-in profile `tls` (below)
# Bump the image tag when a new Vikunja release comes out, here and in
# defaultTestServerImage of packages/vikunja_api/test/contract/helpers.dart.
# VIKUNJA_APP_TEST_VIKUNJA_IMAGE runs another release instead, for example
# vikunja/vikunja:2.7.1 before a tag (docs/releasing.md); the contract tests
# then expect the version of its tag.
# The host port is referenced by the contract tests, tool/*.sh and the docs;
# do not change it. It is published on 127.0.0.1 only, because the server
# allows open registration with a public JWT secret. An Android emulator
# reaches it as localhost after `adb reverse tcp:34527 tcp:34527`.
#
# Start: docker compose -f test_servers/docker-compose.yaml up -d
#        (docker-compose takes the same arguments)
# Wait:  tool/wait_for_test_servers.sh
# Seed:  tool/seed_e2e_user.sh (the sign-in test user, see the README)
# Stop:  docker compose -f test_servers/docker-compose.yaml down
#
# The images are built FROM scratch, so there is no shell for a healthcheck;
# readiness is polled from the host by tool/wait_for_test_servers.sh.
# There is deliberately no top-level `name:`. The project name defaults to
# this directory, and a different name would start a second stack that
# collides with a running one on the same ports.

x-vikunja-env: &vikunja-env
  # Fixed dummy secrets: these servers only ever hold throwaway test data.
  VIKUNJA_SERVICE_SECRET: contract-tests-only-not-a-secret
  VIKUNJA_SERVICE_JWTSECRET: contract-tests-only-not-a-secret
  # The container runs as uid 1000 and its default paths (/db, /app/vikunja/files)
  # are not writable without volumes. The tmpfs below keeps all state in
  # memory, so every restart starts from an empty server.
  VIKUNJA_FILES_BASEPATH: /tmp/files
  VIKUNJA_DATABASE_TYPE: sqlite
  # Vikunja appends "?_busy_timeout=5000&_journal_mode=WAL" to this path, and
  # its SQLite driver reads everything after the first "?" as options:
  # _txlock=immediate makes a transaction wait for the write lock instead of
  # failing parallel writes with "database is locked" (500), and _x= takes
  # Vikunja's own "?_busy_timeout=5000" as its value, which would otherwise
  # stop the server from starting. After an image bump, check the startup
  # line "Using SQLite database at:" and that a contract run logs no
  # "database is locked". A transaction now waits up to 30 s for the lock;
  # should the server exit with "Failed to begin database transaction", drop
  # _txlock=immediate, keep the raised limit and run the vikunja_api contract
  # files one at a time.
  VIKUNJA_DATABASE_PATH: "/tmp/vikunja.db?_txlock=immediate&_busy_timeout=30000&_x="
  # The contract tests and tool/seed_e2e_user.sh create users through /register.
  VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
  # All test traffic comes from one IP. The general limit is off; the limit
  # that sign-in, registration, link-share sign-in and the WebSocket upgrade
  # share (10 a minute per IP) cannot be turned off, only raised. The lockout
  # after ten wrong passwords for one account stays.
  VIKUNJA_RATELIMIT_ENABLED: "false"
  VIKUNJA_RATELIMIT_NOAUTHLIMIT: "1000"
  # A legal link besides the imprint and the privacy policy for the contract
  # tests, named neither "Imprint" nor "Privacy Policy": they expect the
  # server to have neither. /info lists it from 2.8.0; older releases ignore
  # it.
  VIKUNJA_LEGAL_TERMS_TEXT: "Terms of Service"
  VIKUNJA_LEGAL_TERMS_URL: "https://example.org/terms"

# VIKUNJA_SERVICE_PUBLICURL becomes `frontend_url` in /info, where the app
# opens the OAuth authorize page, and it is also the bundled web frontend's
# API base URL. localhost works for the host, the iOS simulator (shares the
# host's network) and the Android emulator with `adb reverse`.
services:
  vikunja:
    image: ${VIKUNJA_APP_TEST_VIKUNJA_IMAGE:-vikunja/vikunja:2.8.0}
    environment:
      <<: *vikunja-env
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:34527/
    tmpfs: ["/tmp:mode=1777"]
    ports: ["127.0.0.1:34527:3456"]

  # Opt-in TLS servers for the connection-profile checks (test_servers/tls/
  # README.md). They start only with `--profile tls`, so CI, a plain `up -d`
  # and tool/contract_tests.sh never see them. Generate the certificates first
  # with tool/gen_tls_test_certs.sh.
  #   34528  self-signed leaf (pin)
  #   34529  client certificate required, server certificate from the test CA
  #   34530  access-header gate like Cloudflare Access, test CA
  #   34531  plain HTTP straight to Vikunja, for seeding from the host only
  vikunja-tls:
    image: ${VIKUNJA_APP_TEST_VIKUNJA_IMAGE:-vikunja/vikunja:2.8.0}
    profiles: ["tls"]
    environment:
      <<: *vikunja-env
      # Not shared with vikunja, so a token of one server fails on the other.
      VIKUNJA_SERVICE_SECRET: tls-tests-only-not-a-secret
      VIKUNJA_SERVICE_JWTSECRET: tls-tests-only-not-a-secret
      VIKUNJA_SERVICE_PUBLICURL: https://localhost:34528/
    tmpfs: ["/tmp:mode=1777"]
    ports: ["127.0.0.1:34531:3456"]
  tls-proxy:
    image: caddy:2.11.7-alpine
    profiles: ["tls"]
    depends_on: [vikunja-tls]
    # Only the two dummy access-header values. Inspect this file with
    # `config --services`, never a plain `config`, which prints them.
    env_file: ./tls/generated/access.env
    volumes:
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls/generated:/certs:ro
    tmpfs: ["/data", "/config"]
    ports:
      - "127.0.0.1:34528:8443"
      - "127.0.0.1:34529:8444"
      - "127.0.0.1:34530:8445"
