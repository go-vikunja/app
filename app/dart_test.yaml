tags:
  contract:
    timeout: 2x
  # Against the opt-in Docker `tls` profile; skipped unless
  # VIKUNJA_APP_TLS_DOCKER=1.
  tls-docker:
    timeout: 2x
  # A release links the source code it was built from (D86): run only for
  # releases, with --run-skipped --tags release.
  release:
    skip: "Runs for releases only: flutter test --run-skipped --tags release"
