name: vikunja_mobile
description: Mobile client for self-hosted Vikunja servers.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  characters: ^1.4.1
  crypto: ^3.0.7
  cupertino_ui: ^1.1.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_selector: ^1.1.0
  # 0.5.3+7 appeared three days before step 26; held until it has been
  # reviewed.
  file_selector_ios: 0.5.3+6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.0.2
  image_picker: ^1.2.4
  # 0.8.13+12 appeared six days before step 26; held until it has been
  # reviewed.
  image_picker_ios: 0.8.13+10
  intl: ^0.20.3
  local_auth: ^3.0.2
  # local_auth's own Android side, which it already pulls in; named for the
  # prompt's title and hint (AndroidAuthMessages).
  local_auth_android: ^2.3.0
  logging: ^1.3.0
  material_ui: ^1.6.0
  native_dio_adapter: ^1.8.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  # QR codes for link shares (step 28, D60): pure Dart, BSD-3-Clause, only
  # depends on meta.
  qr: ^4.0.0
  quick_actions: ^1.1.1
  riverpod_annotation: ^4.0.7
  rurana_widgets:
    path: ../plugins/rurana_widgets
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  vikunja_api:
    path: ../packages/vikunja_api
  vikunja_domain:
    path: ../packages/vikunja_domain
  vikunja_logic:
    path: ../packages/vikunja_logic
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  # 3.27.1 appeared a day before step 25; held until it has been reviewed.
  webview_flutter_wkwebview: 3.27.0
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/editor/
    - assets/legal/

# Regenerate with `dart run flutter_launcher_icons` after changing branding/.
flutter_launcher_icons:
  android: true
  image_path_android: ../branding/png/icon-android-legacy-1024.png
  adaptive_icon_background: ../branding/png/icon-background-1024.png
  adaptive_icon_foreground: ../branding/png/icon-foreground-1024.png
  adaptive_icon_monochrome: ../branding/png/icon-monochrome-1024.png
  # The foreground already keeps the mark inside the 66 dp safe zone.
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: ../branding/png/icon-ios-1024.png
  remove_alpha_ios: true
  # iOS 18: the dark variant is transparent (the system adds the dark
  # background); the tinted one is desaturated from it.
  image_path_ios_dark_transparent: ../branding/png/icon-ios-dark-1024.png
  image_path_ios_tinted_grayscale: ../branding/png/icon-ios-dark-1024.png
  desaturate_tinted_to_grayscale_ios: true
