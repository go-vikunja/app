name: vikunja_mobile
description: Mobile client for self-hosted Vikunja servers.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  crypto: ^3.0.7
  cupertino_ui: ^1.1.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  logging: ^1.3.0
  material_ui: ^1.6.0
  native_dio_adapter: ^1.8.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3
  vikunja_api:
    path: ../packages/vikunja_api
  vikunja_domain:
    path: ../packages/vikunja_domain

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Regenerate with `dart run flutter_launcher_icons` after changing branding/.
flutter_launcher_icons:
  android: true
  image_path_android: ../branding/png/icon-android-legacy-1024.png
  adaptive_icon_background: ../branding/png/icon-background-1024.png
  adaptive_icon_foreground: ../branding/png/icon-foreground-1024.png
  adaptive_icon_monochrome: ../branding/png/icon-monochrome-1024.png
  # The foreground already keeps the mark inside the 66 dp safe zone.
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: ../branding/png/icon-ios-1024.png
  remove_alpha_ios: true
